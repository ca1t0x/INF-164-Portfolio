<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact</title>
        <link rel="icon" href="../img/umbrella.svg" type="image/svg+xml">
        <link rel="stylesheet" href="../css/general.css">
        <link rel="stylesheet" href="../css/navbar.css">
        <link rel="stylesheet" href="../css/footer.css">
        <link rel="stylesheet" href="../css/contact.css">
    </head>

    <body data-root=".." data-page="contact">
        <a class="skip-link" href="#main-content">Skip to content</a>
        <div id="navbar-placeholder"></div>
        <main id="main-content" class="page-wrapper">
            <header class="page-header">
                <p class="eyebrow">Contact</p>
                <h1>Thoughts?<br>Let me know !</h1>
                <p class="header-sub">A favourite episode, your opinion on a character, or just a hello.</p>
            </header>

            <div class="form-wrapper">
                <aside class="contact-aside">
                    <p class="eyebrow">Let's keep the conversation going!</p>
                    <h2>I'd love to hear<br>from your perspective.</h2>
                </aside>

                <!-- novalidate lets JS display error messages. -->
                <form class="contact-form" id="contact-form" novalidate>
                    <div class="form-group">
                        <label for="contact-name">Your name</label>
                        <input id="contact-name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required placeholder="Ted Mosby">
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email address</label>
                        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="TedMosby@mosbiusdesigns.com">
                    </div>
                    <div class="form-group">
                        <label for="contact-message">Your message</label>
                        <textarea id="contact-message" name="message" minlength="10" maxlength="1000" required placeholder="Tell me what you think..." aria-describedby="message-help"></textarea>
                        <p class="form-help" id="message-help">Between 10 and 1,000 characters.</p>
                    </div>
                    <button class="button" type="submit">Preview my message &rarr;</button>
                    <p class="form-error" id="form-error" role="alert" hidden></p>
                    <section class="message-preview" id="message-preview" aria-live="polite" hidden>
                        <h3>Your message preview</h3>
                        <p><strong id="preview-name"></strong><br><span id="preview-email" class="muted"></span></p>
                        <p id="preview-message"></p>
                        <p class="form-help">Preview complete.</p>
                    </section>

                </form>
            </div>
        </main>

        <div id="footer-placeholder"></div>

        <script src="../js/script.js"></script>
        <script src="../js/layout.js"></script>
    </body>
</html>
